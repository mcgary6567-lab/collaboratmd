# Every push and pull request: type check, lint, unit tests, production build and
# end-to-end tests. Everything runs on an embedded database; no secrets or
# production services are used. Protect main so merges need these to pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners are pinned to Ubuntu 24.04: ubuntu-latest moves to 26.04 from
# 2026-10-19, and Playwright's installed browser dependencies must support it
# before we follow. Revisit once a Playwright release lists 26.04.

env:
  NODE_VERSION: "24"
  # Test-only values; nothing here reaches a real service.
  AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
  DATABASE_URL: ""

jobs:
  checks:
    name: Type check and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The packages the app runs on: no known high or critical advisory. Development
      # tools (lint, tests, build helpers) never run in production, so for them only a
      # critical advisory fails the build; the same production check runs monthly
      # (maintenance.yml).
      - name: No known high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: No known critical vulnerabilities in development tools
        run: npm audit --audit-level=critical
      - run: npm run typecheck
      - name: Lint (React and Next.js rules, no warnings allowed)
        run: npm run lint
      - name: Migrations bundle is up to date
        run: node scripts/build-migrations.mjs && git diff --exit-code src/db/migrations.ts
      - run: npx vitest run

  build:
    name: Production build and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - name: Performance budgets
        run: npm run perf

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  time-of-day:
    # Appointment times are clock times at the practice, and several bugs only showed in the
    # practice's evening, when UTC is already on the next day. The time-sensitive flows run with
    # the server's clock moved (libfaketime) to the practice's morning, evening and just after
    # its midnight. Daylight-saving changeovers are covered by the unit tests (practice-time.test.ts).
    name: Time of day (${{ matrix.at }} New York)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        at: ["07:30", "21:30", "00:30"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq faketime
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Move the server's clock to ${{ matrix.at }} in New York
        run: |
          n=$(node scripts/clock-offset.mjs "${{ matrix.at }}" America/New_York)
          echo "E2E_CLOCK_OFFSET_MIN=$n" >> "$GITHUB_ENV"
          # Check libfaketime moves Node's clock as expected before relying on it.
          FAKETIME_DONT_FAKE_MONOTONIC=1 faketime -f "+${n}m" node -e "
            const d = Date.now() - ${n} * 60000 - Number(process.argv[1]) * 1000;
            console.log('server clock will read', new Date(Date.now()).toLocaleString('en-US', { timeZone: 'America/New_York' }), 'in New York');
            if (Math.abs(d) > 120000) { console.error('faketime did not move the clock by the expected amount:', d, 'ms off'); process.exit(1); }" "$(date +%s)"
      - run: npx playwright test e2e/clock.spec.ts e2e/booking.spec.ts e2e/money-path.spec.ts e2e/zz-a11y-records.spec.ts
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  postgres:
    name: Real Postgres behind a pooler
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The other jobs use the embedded database. This one runs start-up and the
    # built app against Postgres through PgBouncer in transaction mode, the way
    # Neon's pooler works, where session state does not survive between
    # transactions (see scripts/startup-check.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:6432/app
      DIRECT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start PgBouncer in transaction mode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
          # The package starts its own service on 6432; this job runs its own configuration instead.
          sudo systemctl stop pgbouncer || true
          mkdir -p "$RUNNER_TEMP/pgb"
          echo '"postgres" "postgres"' > "$RUNNER_TEMP/pgb/users.txt"
          cat > "$RUNNER_TEMP/pgb/pgbouncer.ini" <<INI
          [databases]
          app = host=127.0.0.1 port=5432 dbname=app user=postgres password=postgres
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = plain
          auth_file = $RUNNER_TEMP/pgb/users.txt
          pool_mode = transaction
          default_pool_size = 4
          max_client_conn = 200
          ignore_startup_parameters = extra_float_digits,options
          logfile = $RUNNER_TEMP/pgb/pgbouncer.log
          pidfile = $RUNNER_TEMP/pgb/pgbouncer.pid
          INI
          /usr/sbin/pgbouncer -d "$RUNNER_TEMP/pgb/pgbouncer.ini"
          for i in $(seq 1 20); do pg_isready -h 127.0.0.1 -p 6432 && break; sleep 1; done
          # Fail here, with PgBouncer's own log, rather than as a confusing error in the next step.
          pg_isready -h 127.0.0.1 -p 6432 || { echo "::error title=PgBouncer did not start::see the log below"; cat "$RUNNER_TEMP/pgb/pgbouncer.log" || true; exit 1; }
      - name: Several starts at once, a blocked start, and a start with nothing to do
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/startup-check.ts
      - name: A large practice (100,000 claims) within time budgets, with no missing indexes
        run: npm run -s load-test
        env:
          LOAD_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          LOAD_TEST_BUDGETS: "1"
      - name: The built app, served through the pooler
        run: |
          npx next build
          npx next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          node scripts/live-check.mjs http://localhost:3000
      - name: Logs
        if: failure()
        run: |
          tail -n 50 "$RUNNER_TEMP/pgb/pgbouncer.log" || true
          tail -n 100 "$RUNNER_TEMP/next.log" || true
