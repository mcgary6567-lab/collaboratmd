# Every push and pull request: type check, unit tests, production build and
# end-to-end tests. Everything runs on an embedded database; no secrets or
# production services are used. Protect main so merges need these to pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  # Test-only values; nothing here reaches a real service.
  AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
  DATABASE_URL: ""

jobs:
  checks:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Migrations bundle is up to date
        run: node scripts/build-migrations.mjs && git diff --exit-code src/db/migrations.ts
      - run: npx vitest run

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx next build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
