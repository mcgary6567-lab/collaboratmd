# Monthly restore drill: restores production as it was an hour ago into a
# temporary Neon branch, checks it, and deletes it (scripts/restore-drill.ts,
# docs/08-restore-drill.md). Needs the repository secret NEON_API_KEY and the
# repository variable NEON_PROJECT_ID; without them it reports that it was
# skipped. Run it by hand from Actions > Restore drill > Run workflow.
name: Restore drill

on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Restore, check and delete
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/restore-drill.ts
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RESTORE_HOURS_AGO: "1"
