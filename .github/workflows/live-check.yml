# Checks the live site every 10 minutes from outside: health (database
# answers), sign-in page, home page and status page. See scripts/live-check.mjs.
#
# A failed run emails whoever last changed this schedule (GitHub's default for
# scheduled workflows). To also alert the operators' channel, add the
# repository secret OPS_ALERT_WEBHOOK_URL (Settings > Secrets and variables >
# Actions); the site address can be changed with the variable LIVE_URL.
# GitHub may delay scheduled runs by several minutes when it is busy, and turns
# them off after 60 days without activity in the repository.
name: Live check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node scripts/live-check.mjs "${LIVE_URL:-https://collaboratmd.vercel.app}"
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
